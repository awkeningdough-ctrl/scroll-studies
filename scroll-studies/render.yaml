services:
  - type: web
    name: scroll-studies
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scroll-studies-db
          property: connectionString
databases:
  - name: scroll-studies-db
    plan: free
