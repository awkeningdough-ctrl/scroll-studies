<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scroll Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top"><div class="bar">
  <a class="logo" href="/">Scroll Studies</a>
  <input id="search" type="search" placeholder="Search studies" aria-label="Search studies">
  <nav id="nav"></nav>
</div></header>
<main>
  <div id="hero"></div>
  <div id="tabs"></div>
  <div id="chips"></div>
  <div id="feed"><p class="note">Loading studies…</p></div>
  <div id="more"></div>
</main>
<div id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
